<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="main-principal">

        <header class="topo">
            <div>
                <span class="eyebrow">ORGANIZAÇÃO PESSOAL</span>
                <h1>Login</h1>
                <p class="subtitulo"></p>
            </div>
        </header>

        <section class="form-login">

            <form action="index.html">

                <div class="form-topo">

                    <label for="email">
                        <!-- Email -->
                        <input type="email" placeholder="Digite seu email">
                    </label>


                    <label for="password">
                        <!-- Senha -->
                        <input type="password" placeholder="Digite sua senha">
                    </label>

                </div>

                <button type="submit" class="btn-login">Log in</button>

                <div class="form-bottom">

                    <div class="logged-in">
                        <!-- <label for="logged-in"> -->
                            <input type="checkbox" id="logged-in">
                            <span class="">Stay logged in</span>
                        <!-- </label> -->
                    </div>

                    <a href="" class="esquecir-senha">Forogt your password?</a>

                </div>

            </form>

            <hr class="linha">

            <div class="links">

                <a href="" class="link-01">Don't have an account?</a>

                <a href="" class="link-02">Create an account</a>

            </div>

        </section>

    </main>

</body>

</html>

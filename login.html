<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="main-principal">

        <header class="topo">
            <div>
                <span class="eyebrow">ORGANIZAÇÃO PESSOAL</span>
                <h1>Login</h1>
                <p class="subtitulo"></p>
            </div>
        </header>

        <section class="form-login">

            <form action="index.html">

                <div class="form-topo">

                    <label for="email">
                        <!-- Email -->
                        <input type="email" placeholder="Digite seu email" id="email">
                    </label>


                    <label for="password">
                        <!-- Senha -->
                        <div class="password-input">
                            <input type="password" placeholder="Digite sua senha" id="password">
                            <button type="button" id="alternarSenha" aria-label="Mostrar senha"><img
                                    src="./img/abre-o-olho.png" alt="Olho para mostrar a senha"
                                    class="senha-password" id="iconeOlho"></button>
                        </div>
                    </label>

                </div>

                <button type="submit" class="btn-login">Log in</button>

                <div class="form-bottom">

                    <div class="logged-in">
                        <!-- <label for="logged-in"> -->
                        <input type="checkbox" id="logged-in" class="checkbox">
                        <span class="">Stay logged in</span>
                        <!-- </label> -->
                    </div>

                    <a href="" class="esquecir-senha">Forgot your password?</a>

                </div>

            </form>

            <hr class="linha">

            <div class="links">

                <span class="link-01">Don't have an account?</span>

                <a href="" class="link-02">Create an account</a>

            </div>

        </section>

    </main>

</body>


<script>
    const inputSenha = document.getElementById("password")
    const botaoToggle = document.getElementById("alternarSenha")
    const iconOlho = document.getElementById("iconeOlho")

    /* Evita que o clique no botão dispare comportamentos indesejados da label */
    botaoToggle.addEventListener("click", function (evento) {
        evento.preventDefault()

        if (inputSenha.type === "password") {
            inputSenha.type = "text"
            iconOlho.src = "img/fechar-o-olho.png"
        } else {
            inputSenha.type = "password"
            iconOlho.src = "img/abre-o-olho.png"
        }
    })
</script>

</html>
